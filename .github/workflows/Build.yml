#--------------------------------------------------------------------------------
# Workflow configuration
#--------------------------------------------------------------------------------

name: Build
on:
  push:
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

#--------------------------------------------------------------------------------
# Application metadata
#--------------------------------------------------------------------------------

env:
  VERSION: "2026-Postseason"
  EXECUTABLE: "QDriverStation"
  QMAKE_PROJECT: "QDriverStation.pro"
  QML_DIR: "qml"
  QT_VERSION: "6.6.3"

#--------------------------------------------------------------------------------
# Jobs
#--------------------------------------------------------------------------------

jobs:

  # ---------------- GNU/Linux (AppImage) ----------------
  build-linux:
    runs-on: ubuntu-22.04
    name: '🐧 Linux (AppImage)'
    steps:
      - name: '🧰 Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: '⚙️ Install system dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libzstd-dev libsdl2-dev libfuse2 desktop-file-utils

      - name: '⚙️ Install Qt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qt5compat qtdeclarative qtshadertools
          cache: true

      - name: '🚧 Build'
        run: |
          qmake "${QMAKE_PROJECT}" CONFIG+=release PREFIX=/usr
          make -j$(nproc)

      - name: '📦 Package AppImage'
        run: |
          make INSTALL_ROOT=appdir install

          # linuxdeploy + Qt plugin (Qt6 compatible replacement for linuxdeployqt)
          wget -nv https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -nv https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          export QML_SOURCES_PATHS="$PWD/${QML_DIR}"
          ./linuxdeploy \
            --appdir appdir \
            --plugin qt \
            --output appimage \
            --desktop-file appdir/usr/share/applications/*.desktop

          mv *.AppImage "${EXECUTABLE}-${VERSION}-Linux-x86_64.AppImage"

      - name: '📤 Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTABLE }}-${{ env.VERSION }}-Linux
          path: ${{ env.EXECUTABLE }}-${{ env.VERSION }}-Linux-x86_64.AppImage

  # ---------------- macOS (DMG) ----------------
  build-mac:
    runs-on: macos-latest
    name: '🍎 macOS (DMG)'
    steps:
      - name: '🧰 Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: '⚙️ Install Qt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat qtdeclarative qtshadertools
          cache: true

      - name: '⚙️ Install SDL2'
        run: brew install sdl2

      - name: '🚧 Build'
        run: |
          qmake "${QMAKE_PROJECT}" CONFIG+=release
          make -j$(sysctl -n hw.ncpu)

      - name: '📦 Package DMG'
        run: |
          macdeployqt "${EXECUTABLE}.app" -qmldir="${QML_DIR}" -dmg
          mv "${EXECUTABLE}.dmg" "${EXECUTABLE}-${VERSION}-macOS.dmg"

      - name: '📤 Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTABLE }}-${{ env.VERSION }}-macOS
          path: ${{ env.EXECUTABLE }}-${{ env.VERSION }}-macOS.dmg

  # ---------------- Release (on tag push) ----------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    name: '🚀 Publish release'
    steps:
      - name: '📥 Download artifacts'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: '🚀 Create GitHub release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
